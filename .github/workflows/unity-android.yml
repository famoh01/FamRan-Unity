name: Build Android APK (Unity 6000.3.25f1)

on:
  workflow_dispatch:
    inputs:
      build_app_bundle:
        description: 'Build AAB instead of APK'
        required: false
        default: 'false'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  build-android:
    name: Android IL2CPP ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Free disk space (Unity needs ~35 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk
        run: df -h /

      - name: Cache Library (speeds up repeat builds)
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.25f1
          targetPlatform: Android
          androidExportType: ${{ inputs.build_app_bundle == 'true' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          androidTargetSdkVersion: 34
          androidMinSdkVersion: 24
          androidTargetArchitectures: ARM64
          androidBuildSystem: Gradle
          customParameters: >
            -executeMethod BuildKlassx.Build
            -nographics
            -logFile -

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FamRan-Android
          path: |
            Build/**/*.apk
            Build/**/*.aab
            build/**/*.apk
            build/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Build/**/*.apk
            Build/**/*.aab
          generate_release_notes: true
