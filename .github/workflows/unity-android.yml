name: Build Android APK (Unity 6000.3.25f1)

on:
  workflow_dispatch:
    inputs:
      build_app_bundle:
        description: 'Build AAB instead of APK'
        required: false
        default: 'false'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  build-android:
    name: Android IL2CPP ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Free disk space (Unity image ~9 GB + build)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk
        run: df -h /

      # Restore unmodified textures from the exact user-provided archive.
      - name: Restore original textures from RAR
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/famran-original.rar 'https://drive.usercontent.google.com/download?id=1Fmvgw7hW7utqxdnJA2f0XU8vTNSN0SUv&export=download&confirm=t'
          echo 'cd8ab2ce5b0de32d52d4bc07ad7244fe8911ee7b1c0abc046eec5410d5fa3354  /tmp/famran-original.rar' | sha256sum -c -
          chmod +x ci-tools/unrar
          ci-tools/unrar e -o+ -idq /tmp/famran-original.rar \
            'RanMobileCampusWars/Assets/Texture2D/innerzone_01.png' \
            'RanMobileCampusWars/Assets/Texture2D/mp-campus.png' \
            'RanMobileCampusWars/Assets/Texture2D/mp_hole.png' \
            'RanMobileCampusWars/Assets/Texture2D/phnx_hole.png' \
            'RanMobileCampusWars/Assets/Texture2D/sg_campus.png' \
            'RanMobileCampusWars/Assets/Texture2D/SG_hole.png' \
            'RanMobileCampusWars/Assets/Texture2D/w_4school_inner01.png' \
            'RanMobileCampusWars/Assets/Texture2D/w_4school_inner02.png' \
            'RanMobileCampusWars/Assets/Texture2D/w_city_c_01.png' Assets/Texture2D/
          rm -f /tmp/famran-original.rar
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            library-

      # GameCI v6 has no keystore inputs, so decode our signing keystore into
      # the project root; BuildKlassx.Build picks it up via env vars.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > user.keystore
          ls -la user.keystore

      # GameCI v6 (game-ci/cli) activates a Unity *Personal* seat headlessly from
      # UNITY_EMAIL + UNITY_PASSWORD. No .ulf file and no serial are required, so
      # this works without a desktop machine.
      - name: Build with Unity
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/user.keystore
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          cliVersion: v0.1.76
          versioning: None
          allowDirtyBuild: true
          targetPlatform: Android
          androidExportType: ${{ inputs.build_app_bundle == 'true' && 'androidAppBundle' || 'androidPackage' }}
          androidTargetSdkVersion: 34
          buildMethod: BuildKlassx.Build
          manualExit: true
          customParameters: >
            -nographics
            -logFile -

      - name: Locate APK
        if: always()
        run: |
          echo "--- Build tree ---"
          find Build build -maxdepth 3 \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null || true
          ls -laR Build 2>/dev/null | head -40 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FamRan-Android
          path: |
            Build/**/*.apk
            Build/**/*.aab
            build/**/*.apk
            build/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      # A Release asset is directly downloadable from a phone browser without
      # logging in to GitHub, unlike Actions artifacts.
      - name: Publish APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FamRan APK (ล่าสุด)
          body: |
            APK ที่คอมไพล์จากโปรเจกต์ RanMobileCampusWars (Unity 6000.3.25f1)
            ดาวน์โหลดไฟล์ .apk ด้านล่างแล้วติดตั้งบนมือถือ Android ได้ทันที
          files: |
            Build/**/*.apk
            Build/**/*.aab
          fail_on_unmatched_files: true
